<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Test</title>
  <meta name="description" content="Free online microphone test. Record a few seconds of speech and get a literature-based quality score: noise (SNR), reverb, level, clipping, bandwidth, dropouts, mains hum and more. Runs entirely in your browser — マイクの音質をブラウザでチェック。">
  <link rel="canonical" href="https://vaaaaanquish.github.io/MicrophoneTest/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Microphone Test">
  <meta property="og:description" content="Record a few seconds of speech and get a literature-based mic quality score — noise, reverb, level, clipping and more. Fully client-side.">
  <meta property="og:url" content="https://vaaaaanquish.github.io/MicrophoneTest/">
  <meta property="og:site_name" content="Microphone Test">
  <meta property="og:image" content="https://vaaaaanquish.github.io/MicrophoneTest/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css?v=14">
</head>
<body>
  <main class="container">
    <div class="lang-switch">
      <button data-lang="ja">日本語</button>
      <button data-lang="en">EN</button>
    </div>

    <header>
      <h1><img src="icon.svg" alt="" class="logo">Microphone Test</h1>
      <p class="subtitle" data-i18n="subtitle">マイクを選んで数秒話すだけで、音声の明瞭さをスコアリングします</p>
    </header>

    <!-- Step 1: select a microphone -->
    <section class="card" id="setup-card">
      <h2><span class="step-num">1</span> <span data-i18n="step_mic">マイクを選択</span></h2>
      <div class="mic-row">
        <button id="permission-btn" class="btn btn-primary" data-i18n="btn_permission">🎤 マイクを許可</button>
        <select id="mic-select" disabled>
          <option data-i18n="opt_placeholder">← まずマイクへのアクセスを許可してください</option>
        </select>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="raw-mode" checked>
        <span data-i18n="raw_mode">ブラウザの補正（ノイズ抑制・エコーキャンセル・自動ゲイン）を無効にして素の音を測る</span>
      </label>
    </section>

    <!-- Step 2: record -->
    <section class="card" id="record-card">
      <h2><span class="step-num">2</span> <span data-i18n="step_record">録音してチェック</span></h2>
      <p class="hint" data-i18n-html="hint_html"></p>
      <div class="record-controls">
        <button id="record-btn" class="btn btn-primary" data-i18n="btn_record" disabled>● 録音開始</button>
        <div class="record-status" id="record-status"></div>
      </div>
      <div class="meter-wrap">
        <canvas id="waveform" width="1024" height="180"></canvas>
        <div class="level-meter">
          <div class="level-bar" id="level-bar"></div>
        </div>
      </div>
    </section>

    <!-- Step 3: results -->
    <section class="card hidden" id="result-card">
      <h2><span class="step-num">3</span> <span data-i18n="step_result">結果</span></h2>
      <div class="overall-score">
        <div class="score-ring" id="score-ring">
          <div class="score-inner">
            <span class="value" id="overall-score">–</span>
            <small>/ 100</small>
          </div>
        </div>
        <div class="overall-verdict">
          <div id="overall-label" class="verdict-label">–</div>
          <div id="overall-desc" class="verdict-desc"></div>
          <div class="player-row">
            <audio id="playback" controls></audio>
            <label class="checkbox-label">
              <input type="checkbox" id="normalize-playback" checked>
              <span data-i18n="normalize">音量を上げて再生</span>
            </label>
          </div>
        </div>
      </div>

      <div class="metrics-grid" id="metrics-grid"></div>

      <div class="advice-section">
        <h3 data-i18n="advice_title">💡 改善ポイント</h3>
        <ul id="advice-list"></ul>
      </div>

      <button id="retry-btn" class="btn btn-secondary" data-i18n="btn_retry">もう一度測定する</button>
    </section>

    <footer>
      <details>
        <summary data-i18n="methodology_summary">スコアリングの根拠について</summary>
        <div id="methodology"></div>
      </details>
      <div class="footer-links">
        <a href="https://github.com/vaaaaanquish/MicrophoneTest" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/></svg>
          vaaaaanquish/MicrophoneTest
        </a>
      </div>
    </footer>
  </main>

  <!-- ?v= is a cache buster; bump it whenever js/css change -->
  <script type="module" src="app.js?v=14"></script>
</body>
</html>
